[package]
name = "elephant"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust facade for embedding Elephant knowledge storage and ingestion"

[dependencies]
elephant-types = { path = "../types", version = "0.9.0" }
elephant-storage = { path = "../storage", version = "0.9.0" }
elephant-pipeline = { path = "../pipeline", version = "0.9.0" }
elephant-pipeline-bin = { path = "../../bin/elephant-pipeline", package = "elephant-pipeline-bin", version = "0.9.0" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.14"

[features]
default = ["meerkat-extraction"]
meerkat-extraction = ["elephant-pipeline-bin/meerkat-extraction", "elephant-pipeline/meerkat-extraction"]
fastembed = ["elephant-pipeline-bin/fastembed"]

[lints]
workspace = true
