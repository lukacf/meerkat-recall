[package]
name = "elephant-benchmarks"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
default-run = "elephant-benchmarks"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

elephant-db = { path = "../../crates/elephant-db" }
elephant-embeddings = { path = "../../crates/embeddings" }
elephant-e2e = { path = "../e2e" }
elephant-migrations = { path = "../../crates/migrations" }
elephant-mcp = { path = "../../crates/mcp" }
elephant-pipeline = { path = "../../crates/pipeline", features = ["meerkat-extraction"] }
elephant-policy = { path = "../../crates/policy" }
elephant-storage = { path = "../../crates/storage", features = ["test-utils"] }
elephant-types = { path = "../../crates/types" }
meerkat = { workspace = true }
meerkat-core = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
