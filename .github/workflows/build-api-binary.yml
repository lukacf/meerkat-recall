name: Build API binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # glibc 2.35 allows the artifact to run on Debian 12 (glibc 2.36).
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted runner disk space
        run: |
          df -h / /mnt
          # Disposable image SDKs unused by Rust/RocksDB. Keep C/C++ and libclang.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / /mnt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Resolve repository Cargo paths
        id: cargo-paths
        run: |
          ./scripts/repo-cargo --print-env > "$RUNNER_TEMP/elephant-cargo-env"
          sed -n '/^CARGO_HOME=/p; /^CARGO_TARGET_DIR=/p' \
            "$RUNNER_TEMP/elephant-cargo-env" >> "$GITHUB_ENV"
          target_dir="$(sed -n 's/^CARGO_TARGET_DIR=//p' "$RUNNER_TEMP/elephant-cargo-env")"
          # rust-cache joins this path to the workspace, so it must be relative.
          printf 'target=%s\n' "$(realpath --relative-to="$GITHUB_WORKSPACE" "$target_dir")" \
            >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: deploy-u2204-wrapper-v1
          workspaces: ". -> ${{ steps.cargo-paths.outputs.target }}"
      - name: Add build swap
        run: |
          sudo fallocate -l 10G /mnt/elephant-build.swap
          sudo chmod 600 /mnt/elephant-build.swap
          sudo mkswap /mnt/elephant-build.swap
          sudo swapon /mnt/elephant-build.swap
          df -h / /mnt
      - name: Build unified elephant binary with RocksDB
        run: |
          ./scripts/repo-cargo build --locked --profile deploy -p elephant-bin --features rocksdb
          target_dir="$(./scripts/repo-cargo --print-env | sed -n 's/^CARGO_TARGET_DIR=//p')"
          mkdir -p artifacts
          cp "$target_dir/deploy/elephant" artifacts/elephant
          ldd artifacts/elephant
          artifacts/elephant --help
          sha256sum artifacts/elephant > artifacts/elephant.sha256
          mkdir -p artifacts/elephant-third-party/surrealkv-0.9.3
          cp vendor/surrealkv-0.9.3/LICENSE artifacts/elephant-third-party/surrealkv-0.9.3/LICENSE
          cp vendor/surrealkv-0.9.3-backport.md vendor/surrealkv-0.9.3-backport.patch vendor/surrealkv-0.9.3-upstream-sha256.json artifacts/elephant-third-party/
      - name: Report build disk usage
        if: always()
        run: |
          df -h / /mnt
          du -sh "$CARGO_HOME" "$CARGO_TARGET_DIR" || true
      - uses: actions/upload-artifact@v4
        with:
          name: elephant-linux-amd64
          path: artifacts/elephant*
          if-no-files-found: error
