# Development mode: Only runs SurrealDB
# Run API and pipeline locally with cargo for fast iteration

services:
  surrealdb:
    # Build/load the reviewed paired server first; vanilla images lack its capability.
    image: "${RECALL_SURREAL_IMAGE:?Set RECALL_SURREAL_IMAGE to the reviewed paired server image}"
    pull_policy: never
    container_name: elephant-surrealdb-dev
    user: "65532:65532"
    command:
      - start
      - --log=info
      - --user=root
      - --pass=root
      - file:/data/database.db
    volumes:
      - surrealdb_data_dev:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/recall-surreal", "is-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  surrealdb_data_dev:
    driver: local
