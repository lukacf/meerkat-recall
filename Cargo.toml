[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/elephant-db",
    "crates/storage",
    "crates/policy",
    "crates/identity",
    "crates/outbox",
    "crates/embeddings",
    "crates/pipeline",
    "crates/mcp",
    "crates/extensions",
    "crates/knowledge-views",
    "crates/migrations",
    "crates/elephant",
    "bin/elephant-api",
    "bin/elephant-pipeline",
    "bin/elephant",
    "tests/scenarios",
    "tests/benchmarks",
    "tests/e2e",
    "tests/calibration",
    "tests/dev_readiness",
    "xtask",
]
default-members = [
    # Fast-by-default packages for `cargo test --lib --bins` in workspace root.
    # Heavy/slow packages (pipeline, API, embeddings, scenarios) are exercised via
    # `cargo test --workspace ...` and `cargo test-e2e`.
    "crates/types",
    "crates/elephant-db",
    "crates/storage",
    "crates/policy",
    "crates/identity",
    "crates/outbox",
    "crates/mcp",
    "crates/extensions",
    "crates/knowledge-views",
    "crates/migrations",
    "crates/elephant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Elephant Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukacf/elephant"
rust-version = "1.94.0"

[workspace.dependencies]
# Meerkat - keep the facade and direct family dependencies on one release.
meerkat = { version = "=0.8.47", default-features = false, features = ["anthropic", "openai", "gemini", "memory-store", "mcp", "session-compaction", "comms"] }
meerkat-core = { version = "=0.8.47" }
meerkat-mcp = { version = "=0.8.47" }
meerkat-runtime = { version = "=0.8.47" }
meerkat-skills = { version = "=0.8.47", default-features = false }
# Test-only: pins the model-catalog regression test (gpt-5.6-sol resolution),
# the reason this port exists. Version-unified with the meerkat facade above.
meerkat-models = { version = "=0.8.47" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
surrealdb = { version = "2.1", features = ["kv-mem"] }

# Tracing/Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.19", features = ["derive"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde", "js"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"
toml = "0.8"

# Testing
proptest = "1.5"
tokio-test = "0.4"
rstest = "0.23"

# JWT/Auth
jsonwebtoken = "9.3"

# HTTP client (for tool router)
reqwest = { version = "0.12", features = ["json"] }

# OpenAPI
utoipa = { version = "5.3", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum"] }

# Async traits
async-trait = "0.1"

# Futures
futures = "0.3"

# Derive more
derive_more = { version = "1.0", features = ["display", "from", "into", "deref", "deref_mut"] }

# Base64
base64 = "0.22"

# Hashing
sha2 = "0.10"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Opt-in deployment build for memory-constrained Linux CI runners.
# Keep normal release optimization; relax only the large generated Meerkat schema crate.
[profile.deploy]
inherits = "release"
lto = false
codegen-units = 256

[profile.deploy.package.meerkat-machine-schema]
opt-level = 0

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "Release v{{version}}"
pre-release-hook = ["bash", "-c", "$(git rev-parse --show-toplevel)/scripts/release-hook.sh {{version}}"]
publish = false
push = true
