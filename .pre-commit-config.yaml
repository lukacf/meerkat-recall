# Pre-commit configuration for Elephant
# Install: pip install pre-commit
# Setup: pre-commit install && pre-commit install --hook-type pre-push

default_stages: [pre-commit]

repos:
  # On commit: auto-format Rust code
  - repo: local
    hooks:
      - id: cargo-fmt-fix
        name: cargo fmt (auto-fix)
        entry: ./scripts/repo-cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

  # On push: secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push]

  # On push: file hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Preserve exact published notices, source metadata, and storage backport bytes.
        exclude: ^vendor/(?:pdf-inspector/external/bcmaps/LICENSE$|surrealkv-0\.9\.3(?:/|-backport\.patch$))
        args: [--markdown-linebreak-ext=md]
        stages: [pre-push]
      - id: end-of-file-fixer
        exclude: ^vendor/(?:pdf-inspector/\.cargo_vcs_info\.json$|surrealkv-0\.9\.3(?:/|-backport\.patch$))
        stages: [pre-push]
      - id: check-yaml
        stages: [pre-push]
      - id: check-toml
        stages: [pre-push]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-push]
      - id: check-merge-conflict
        stages: [pre-push]
      - id: detect-private-key
        stages: [pre-push]

  # On push: formatting/linting/surface/unit gate
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: make fmt-check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-clippy
        name: cargo clippy
        entry: make hook-lint
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: verify-surface
        name: verify active surface
        entry: make verify-surface
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test
        name: workspace unit gate
        entry: scripts/pre-push-unit.sh
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
