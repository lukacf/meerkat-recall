title = "Elephant secret scanning"

# A custom config replaces defaults unless it explicitly extends them.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic assertion idempotency keys used by regression tests"
condition = "AND"
paths = ['''^crates/(storage|pipeline)/''']
regexTarget = "match"
regexes = [
  '''assertion_key[:,]\s+"(unique_key_abc123|different_key_xyz789|test_key_one|test_key_two)"''',
]

# Reviewed false positives retain default detection everywhere else. Each entry
# requires both an exact file path and the reviewed literal match. Fixtures are
# synthetic; SHA-256 values are public integrity digests, not credentials.

[[allowlists]]
description = "Synthetic HMAC key of a list_upcoming_events test, generated at runtime since; kept for history"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^crates/mcp/src/handlers/events\.rs$''']
regexTarget = "match"
regexes = [
  '''^secret = "upcoming-cursor-test-secret-of-32-bytes"$''',
]

[[allowlists]]
description = "Example idempotency labels, not authentication credentials"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^crates/mcp/src/handlers/public_sources\.rs$''']
regexTarget = "match"
regexes = [
  '''^idempotency_key":"withdraw-meeting-42"$''',
]

[[allowlists]]
description = "Example idempotency labels, not authentication credentials"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^docs/internal/recall-preview-contract/ob3-consumer-fixtures\.json$''']
regexTarget = "match"
regexes = [
  '''^Idempotency-Key": "ob3-fixture-A-from-B"$''',
  '''^Idempotency-Key": "ob3-fixture-B-from-A"$''',
  '''^Idempotency-Key": "ob3-fixture-unseen-stale"$''',
]

