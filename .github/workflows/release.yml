name: Build release candidates

# Build candidates explicitly, then promote verified artifacts as described in
# docs/operations/deployment.mdx. Creating a tag must not publish another binary.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Do not bind macOS release binaries to a runner's Homebrew installation.
  LZMA_API_STATIC: "1"

jobs:
  release-validate:
    name: Validate release state
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / /mnt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Resolve repository Cargo paths
        id: cargo-paths
        shell: bash
        run: |
          ./scripts/repo-cargo --print-env > "$RUNNER_TEMP/elephant-cargo-env"
          sed -n '/^CARGO_HOME=/p; /^CARGO_TARGET_DIR=/p' \
            "$RUNNER_TEMP/elephant-cargo-env" >> "$GITHUB_ENV"
          target_dir="$(sed -n 's/^CARGO_TARGET_DIR=//p' "$RUNNER_TEMP/elephant-cargo-env")"
          python3 - "$target_dir" <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          print(f"target={os.path.relpath(sys.argv[1], os.environ['GITHUB_WORKSPACE'])}")
          PY

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-validate-wrapper-v1
          workspaces: ". -> ${{ steps.cargo-paths.outputs.target }}"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run release smoke preflight
        run: make ci-smoke

  build-binaries:
    name: Build ${{ matrix.target }} candidate
    needs: [release-validate]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 remains compatible with Debian 12 (glibc 2.36).
          - runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runs-on: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free hosted Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / /mnt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Install Python for native artifact verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify native target and resolve Cargo paths
        id: cargo-paths
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host_target" = "$EXPECTED_TARGET"
          ./scripts/repo-cargo --print-env > "$RUNNER_TEMP/elephant-cargo-env"
          sed -n '/^CARGO_HOME=/p; /^CARGO_TARGET_DIR=/p' \
            "$RUNNER_TEMP/elephant-cargo-env" >> "$GITHUB_ENV"
          target_dir="$(sed -n 's/^CARGO_TARGET_DIR=//p' "$RUNNER_TEMP/elephant-cargo-env")"
          python3 - "$target_dir" <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          print(f"target={os.path.relpath(sys.argv[1], os.environ['GITHUB_WORKSPACE'])}")
          PY

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-deploy-fastembed-${{ matrix.target }}-wrapper-v2
          workspaces: ". -> ${{ steps.cargo-paths.outputs.target }}"

      - name: Add Linux build swap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 10G /mnt/elephant-build.swap
          sudo chmod 600 /mnt/elephant-build.swap
          sudo mkswap /mnt/elephant-build.swap
          sudo swapon /mnt/elephant-build.swap

      - name: Build and package exact native candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RECALL_BUILD_MIN_FREE_GIB: "32"
        run: |
          set -euo pipefail
          scripts/release/build-native "$TARGET" "$RUNNER_TEMP/recall-dist"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ldd "$CARGO_TARGET_DIR/deploy/meerkat-recall"
          else
            otool -L "$CARGO_TARGET_DIR/deploy/meerkat-recall"
          fi

      # Retain candidate bytes for private acceptance if attestation fails.
      # The required attestation step still fails the run and blocks promotion.
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meerkat-recall-${{ matrix.target }}
          path: ${{ runner.temp }}/recall-dist/*
          if-no-files-found: error

      - name: Attest archive build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/recall-dist/*.tar.gz

      - name: Report build disk usage
        if: always()
        shell: bash
        run: |
          df -h /
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then
            du -sh "$CARGO_HOME" "$CARGO_TARGET_DIR" || true
          fi
