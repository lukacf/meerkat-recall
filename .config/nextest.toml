[profile.default]
# Native database fixtures may each create a Tokio pool sized to this host.
# Bound simultaneous fixtures on large shared hosts instead of multiplying
# machine-wide worker pools by the machine-wide default test count.
test-threads = 8

# This real 256-Work / 257-Source native boundary retains its original 240s
# deadline. Give it the full test scheduler budget, as in its retained isolated
# qualification, instead of competing with unrelated database constructors.
[[profile.default.overrides]]
filter = "test(=reprocess::budget::independent_producer_ancestry::native_actual_256_work_and_257_source_boundaries)"
threads-required = "num-test-threads"

# This test already publishes fourteen sources concurrently. Reserve the runner's
# slots so unrelated tests do not distort its unchanged 180-second deadline.
[[profile.default.overrides]]
filter = 'package(elephant-pipeline-bin) & test(=runtime::work_item_tests::source_finalizer_contention_tests::surreal_fourteen_same_space_source_finalizers_complete)'
threads-required = "num-test-threads"

# This full-book scenario is CPU intensive. Keep its original 300-second
# pipeline deadline while reserving the runner's slots for the complete test.
[[profile.default.overrides]]
filter = 'package(elephant-scenarios) & test(=embedded_elephant_db::scenario_embedded_elephant_db_ingests_alice_and_searches_semantically)'
threads-required = "num-test-threads"

# This control applies its real 100ms engine deadline during database setup too.
# Concurrent database fixtures exhausted that deadline before the assertion ran.
# Reserve this runner's slots; keep the engine deadline and 1s wall bound intact.
[[profile.default.overrides]]
filter = 'package(elephant-storage) & test(=client::tests::query_deadline_stops_engine_before_later_statements)'
threads-required = "num-test-threads"
