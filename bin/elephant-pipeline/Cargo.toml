[package]
name = "elephant-pipeline-bin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pipeline worker for Elephant ingestion and processing"
autobins = false

[dependencies]
elephant-types = { path = "../../crates/types" }
elephant-storage = { path = "../../crates/storage" }
elephant-pipeline = { path = "../../crates/pipeline" }
elephant-embeddings = { path = "../../crates/embeddings" }
elephant-outbox = { path = "../../crates/outbox" }
elephant-migrations = { path = "../../crates/migrations" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
config = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[features]
rocksdb = ["elephant-storage/rocksdb"]
default = ["meerkat-extraction"]
meerkat-extraction = ["elephant-pipeline/meerkat-extraction"]
fastembed = ["elephant-embeddings/fastembed"]
test-utils = []

[dev-dependencies]
axum = { workspace = true }
futures = { workspace = true }
meerkat = { workspace = true }
meerkat-core = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
elephant-auth = { path = "../../crates/auth" }
elephant-policy = { path = "../../crates/policy" }
tokio-test = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
