name: CI

on:
  push:
    branches:
      - main
      - release/**
      - ci/**
      - feat/**
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  container-config:
    name: Container configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate local Compose examples
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          bash -n rebuild-fast.sh
      - name: Check Dockerfile
        run: docker buildx build --call=check .

  secrets:
    name: Secret scan (full Git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable commits without printing credentials
        run: >-
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history -m"
          --config .gitleaks.toml --redact --no-banner
          --ignore-gitleaks-allow --max-archive-depth 3

  fmt-lint:
    name: Format, lint, and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: make fmt-check

      - name: Verify active surface and legacy drift
        run: make verify-surface

      - name: Verify version parity
        run: make verify-version-parity

      - name: Clippy
        run: make lint

  test-unit:
    name: Workspace unit gate
    runs-on: ubuntu-latest
    env:
      # Same linker-pressure mitigation as test-all: the runner's ld dies with
      # SIGBUS (disk/memory exhaustion) when linking debug-heavy test binaries.
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: unit

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace unit gate
        run: make test-unit

  test-all:
    name: Full test suite (all features)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: all-features

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run full suite
        run: make test-all

  e2e:
    name: E2E tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release/')
        )
      )
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: e2e

      - name: Run E2E tests
        run: make test-e2e

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run audit
        run: make audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: docs

      - name: Build docs
        run: make doc
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-check:
    name: WASM check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wasm32

      - name: Check elephant-db for wasm32
        run: ./scripts/repo-cargo check -p elephant-db --target wasm32-unknown-unknown
